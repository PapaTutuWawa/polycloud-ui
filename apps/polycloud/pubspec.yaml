name: polycloud
description: "A modular cloud server."
publish_to: 'none'
resolution: workspace

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # State
  flutter_secure_storage: 11.2.0
  uuid: ^4.6.0

  # Network
  dio: 5.11.1
  uri: 1.0.0

  # Apps
  polycloud_client_core:
  polycloud_client_oidc:
  polycloud_client_calendar:

  # UI
  go_router: ^18.0.1
  polycloud_ui_hazmat:
    git:
      url: https://github.com/PapaTutuWawa/polycloud-ui-hazmat.git
      ref: 230709ede0841972bea3101d3ed90520af3ee06d
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Web
  web: ^1.1.1

  # Misc
  copy_with_extension: ^17.1.0
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner:
  riverpod_generator: ^4.0.9
  copy_with_extension_gen: 17.1.0

flutter:
  uses-material-design: true
